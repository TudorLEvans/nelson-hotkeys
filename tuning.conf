# KEYBOARD WARRIOR tunables.
#
# Edit while the game is running. Polled every 30 frames and reloaded on change,
# so tuning never needs a rebuild. An unknown key is an error, reported in the
# --debug overlay rather than ignored: a silent typo looks exactly like bad game
# feel. A test checks this file against the code, so a renamed key cannot ship
# stale again.

# Screen contract. The playfield is capped and centred so a huge terminal does
# not hand the player a wider field to spread words across.
min_cols = 80
min_rows = 24
max_cols = 120
max_rows = 40

# Baseline fall speed in rows per second, before the ramp.
fall_speed = 1.2

# Seconds per global movement tick. Every word advances on this one clock, so the
# field moves together instead of each word crossing cell boundaries at its own
# moment. It also sets how finely fall_speed can be hit: too coarse and 1.2 rows
# per second rounds to 1.79.
step_interval = 0.05

# Chip acceleration: speed gained per letter destroyed. The game's central
# tension, and the reason long words are dangerous rather than merely long. A
# fully pre-chewed word should run at roughly 1.5-1.7x.
chip_accel = 0.12

# Global speed multiplier, also settable with --speed.
speed_scale = 1.0

# Lives.
lives = 3
max_lives = 5

# A landing clears every word within shockwave_rows of the floor and freezes
# spawning for spawn_pause seconds. Without this, being overwhelmed ends the run
# in two seconds and the loss reads as arbitrary rather than earned.
spawn_pause = 1.5
shockwave_rows = 3

# Rows above the floor at which a word starts pulsing. The depth colour already
# says "worth more"; this says "about to cost you", which is a different message.
danger_rows = 4

# Typo heat. Every miss makes the whole field faster by heat_per_miss, decaying
# with heat_half_life, capped at heat_max. It is the one thing that responds to
# how you are playing, and it is one-directional on purpose: the schedule is the
# best case, so flawless typing traces the canonical curve and mistakes push you
# above it. Letting clean play dip below would mean the fastest run was no longer
# the clean one.
#
# Picked from the equilibrium a steady miss rate settles at, not by feel: about
# +3% for a 95%-accurate typist at four keys a second, +14% at 80%, the cap for a
# masher. An earlier set ran at twice these numbers and was too heavy in play; a
# typo should be a nudge you notice, not a change of gear.
heat_per_miss = 0.04
heat_half_life = 3.0
heat_max = 0.35

# Chains. Completions inside chain_window seconds of each other multiply the
# completion bonus: x2, x3, x5, then x8. This is what pays for free fire, and
# chain_min_streak stops mashing from stumbling into it.
#
# STREAK counts consecutive correct keys. CHAIN counts words finished inside the
# window. They were both called some form of "combo" and sat next to each other in
# the HUD, which was most of the reason nobody could describe what a chain was.
chain_window = 1.5
chain_min_streak = 5

# Chain milestones. Past these depths a chain pays in SURVIVAL rather than points,
# because once the field is fast enough a score multiplier is a consolation prize
# and the problem is staying alive. Earned entirely by the player, unlike a
# power-up, and self-gating: chains get harder to build exactly as the game speeds
# up, so the deep tiers become rarer as they become more valuable.
chain_slow_at = 4      # a breather
chain_shield_at = 6    # next landing free
chain_sweep_at = 8     # everything in the lower half destroyed
chain_life_at = 10     # one life back

# ---------------------------------------------------------------------------
# Difficulty: a schedule on the clock, never a response to how well you play, so
# two runs of the same length get the identical sequence of pressure.
#
# Level 1 lasts level_base seconds and each level after lasts level_growth
# longer, fractionally. Early levels are short deliberately: the bottom of the
# range is trivial for anyone who can already type, so equal-length levels waste
# the opening. Level 5 arrives at about a minute, level 10 at about three.
level_base = 8
level_growth = 0.25

# Everything below is read from a CONTINUOUS level value, so speed and spawn gap
# creep every frame rather than jumping at level boundaries. The integer level is
# displayed but nothing in the simulation reads it.
#
# speed_curve is an exponent below 1, making the ramp concave: steep early,
# flattening later. Linear was wrong at both ends, lingering on trivial words and
# then walking evenly into the ceiling. speed_late is a small linear term so the
# curve never goes completely flat.
speed_growth = 0.55
speed_curve = 0.5
speed_late = 0.02

# Speed ceiling. At 4.5 the schedule stops biting after about twelve minutes, so
# a good enough player survives indefinitely. Set 0 for no ceiling.
max_fall_speed = 4.5

# Spawn gap at level 1, multiplied by interval_factor per level down to the floor.
spawn_interval = 3.5
interval_factor = 0.88
min_spawn_interval = 0.6

# Concurrency, capped by what the playfield can hold without words overlapping.
start_words = 2
steps_per_extra_word = 2

# Word length. The ceiling climbs fast then flattens, so 3 and 4 letter words are
# gone inside the first minute: only someone who cannot type finds them hard.
word_len_start = 5
word_len_growth = 2.2
word_len_curve = 0.5
word_len_max = 12
word_len_min = 3
word_len_spread = 3

# Typing difficulty. Length is a crude proxy for how hard a word is: MINIMUM is
# eleven letters and rolls off the hand, POLKA is five and asks one finger to do
# two jobs in a row. This biases selection toward awkward words as the run goes
# on, so the late game feels different rather than merely longer.
#
# Scored on same-finger repeats, same-hand runs and reaches off the home row.
# ASSUMES QWERTY: set typing_difficulty to 0 on Dvorak or Colemak, where the
# scores are simply wrong.
typing_difficulty = 1.0
typing_difficulty_by = 12
typing_difficulty_scale = 1.6

# ---------------------------------------------------------------------------
# Power-ups: words with a typed punctuation suffix.
#   .  FREEZE   everything stops
#   -  REWIND   push the field back up
#   /  BLAST    destroy every word near where it went off, no letter score. Where
#               you finish the word matters, not only that you finished it.
#   +  REPAIR   one life back
#
# There were nine. Six of the marks meant nothing on sight, which left the player
# memorising a table instead of reading the field, so the set was cut to four that
# can be guessed at: a full stop stops, a minus pushes back, a slash cuts down what
# is near, a plus adds a life. SLOW and SHIELD survive as chain rewards only (see
# chain_slow_at, chain_shield_at); STEADY, AUTOCHIP and CLEAR are gone. See
# internal/engine/powerup.go for why each one went.
#
# powerup_level_bonus draws them from the length band the schedule would use this
# many levels later, so a power-up is always a longer word than its neighbours.
# That is the whole trade: more letters to type, more time exposed, and chip
# acceleration bites harder on a long word. A power-up on a short word would be a
# free gift taken without thought.
powerup_from_level = 3
powerup_chance = 0.22
powerup_level_bonus = 2

# Rarity tracks strength. A common power-up is one you can plan around, so the
# mild ones appear often enough to become part of how the game is played; a strong
# one is a moment, and a moment every thirty seconds is not a moment. Weights are
# relative to each other, so raising one lowers everything else in practice.
weight_blast = 15   # / destroy everything near where it went off
weight_freeze = 14  # . everything stops
weight_rewind = 12  # - push the field back up
weight_repair = 5   # + one life back

# ---------------------------------------------------------------------------
# Rhythm. Monotone escalation is not tension: the schedule rises smoothly forever,
# which is right as a floor but gives a run no shape.
#
# A breath after every breathe_every words lands just after a burst of clearing,
# which is when a pause reads as a reward rather than dead air.
breathe_every = 10
breathe_seconds = 2

# A SWARM drops swarm_size short words at once, all starting with the same letter.
# It is a designed showcase for free fire: one letter pressed N times takes the
# head off N words, lowest first, so this is where the mechanic pays off
# spectacularly rather than incidentally.
swarm_from_level = 4
swarm_every = 90
swarm_size = 5

# ---------------------------------------------------------------------------
# Bombs: words you must NOT finish.
#
# A bomb never takes priority. A keypress reaches one only when no safe word on
# the field wants that letter, which makes bombs impossible to be forced into: no
# arrangement of words can make a bomb letter unavoidable. The only way to feed a
# bomb is to press a letter nothing else wants, which is what a typo looks like.
#
# Bombs land harmlessly, so ignoring one is always valid and usually right.
bomb_from_level = 4
bomb_chance = 0.08
bomb_len_min = 5
bomb_len_max = 7
bomb_costs_life = 1

# ---------------------------------------------------------------------------
freeze_seconds = 3
# SLOW is no longer a power-up; it is the chain reward at chain_slow_at. It stacks
# rather than replacing: each grant removes slow_per_pickup of the field's speed,
# adding up to slow_max, and each grant's slice lasts slow_seconds before draining
# away. So one is a nudge and several in a row are a mode change earned.
slow_per_pickup = 0.20
slow_max = 0.50
slow_seconds = 8
rewind_rows = 4

# The blast box, centred on the word that went off. Wide and shallow, because the
# field is wider than it is tall and a square would feel like it missed.
blast_rows = 9
blast_cols = 40
